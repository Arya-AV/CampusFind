{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<section class="empty-state not-found">
  <div class="empty-icon">🔒</div>
  <h1>Access Denied (403)</h1>
  <p>You do not have permission to modify this listing. Only the person who created this post can update its status.</p>
  <a class="button button-primary" href="{{ url_for('index') }}">Back to listings</a>
</section>
{% endblock %}
